  }
  UI.guruBusy = false; UI.guruLive = ""; GURU_CTL = null; UI.guruScroll = true;
  save(); rerender();
}
let FB_CTL = null;
async function sponFeedback(){
  if(!SAMPLE || UI.fbBusy) return;
  const sp = UI.spon, f = FIG_BY[sp.fid];
  const text = (UI.sponText || "").trim();
  if(text.length < 20){ UI.fbErr = "Tulis atau diktekan dulu latihan Anda (minimal satu-dua kalimat)."; rerender(); return; }
  UI.fbBusy = true; UI.fb = ""; UI.fbErr = ""; rerender();
  const prompt = "Kamu pembimbing pembaca maqtal dan radud di Indonesia. Nilai latihan spontan berikut dalam bahasa Indonesia, ringkas (maksimal 220 kata).\n\n" +
    "Tokoh: " + f.n + " (" + f.when + ")\nAdegan: " + sp.scene + "\nBatasan latihan: " + sp.rule + "\nDurasi: " + sp.dur + " detik\n" +
    "Fakta pegangan — titik pecah: " + f.titik + "\nDetail: " + f.detail.join(" | ") + "\nCatatan riwayat: " + f.catatan.join(" | ") + "\n\n" +
    "Teks/transkrip latihan:\n\"\"\"\n" + text.slice(0, 6000) + "\n\"\"\"\n\n" +
    "Format jawaban:\n1. Skor TANGIS dalam satu baris (T, A, N, G, I, S masing-masing 1–5). TANGIS = Tempat & waktu, Akrab, Nyata, Gema tokoh, Ikat ke jamaah, Seruan.\n2. Apakah batasan latihan dipenuhi (satu kalimat).\n3. Dua perbaikan terpenting, konkret.\n4. Satu versi contoh 3–5 kalimat dengan tanda [jeda], [bisik], [naik].\n5. Bila ada klaim riwayat yang lemah atau tak bersumber di teks, sebutkan singkat.\nJangan mengarang kutipan Arab atau sumber.";
  const ctl = new AbortController(); FB_CTL = ctl;
  try{
    const res = await SAMPLE(prompt, {cache:false, signal:ctl.signal, onText:({text}) => { UI.fb = text; const el = document.getElementById("fbBox"); if(el) el.innerHTML = md(text); }});
    UI.fb = res.text; S.spontanFb++; addXP(5, "umpan balik Guru");
  }catch(e){ if(e && e.text) UI.fb = e.text; UI.fbErr = aiErr(e); }
  UI.fbBusy = false; FB_CTL = null; rerender();
}

/* ============================================================
   ACTIONS
   ============================================================ */
function go(tab){ TAB = tab; rerender(); window.scrollTo(0,0); try{ if(location.hash !== "#" + tab) location.hash = tab; }catch(e){} }
function startSession(ids){
  const q = ids || HAFAL.filter(h => S.cards[h.id] && S.cards[h.id].due <= dk(0)).map(h => h.id).concat(newQueue().map(h => h.id));
  if(!q.length){ toast("Tidak ada kartu untuk hari ini"); return; }
  UI.sess = {q, i:0, lv:0, rev:{}, showTr:false, retry:{}, full:!ids};
  go("hafal");
}
const IV = [0,1,2,4,7,15,30];
function rate(r){
  const s = UI.sess; const id = s.q[s.i];
  const wasNew = !S.cards[id];
  const c = S.cards[id] || {box:0, due:dk(0), n:0};
  c.n++;
  if(r === "lancar"){ c.box = Math.min(6, c.box + 1); c.due = dk(IV[c.box]); }
  else if(r === "ragu"){ c.box = Math.max(1, c.box); c.due = dk(1); }
  else { c.box = 0; c.due = dk(0); if(!s.retry[id]){ s.retry[id] = 1; s.q.push(id); } }
  S.cards[id] = c;
  if(wasNew){ const t = dk(0); if(S.lastNew.d !== t) S.lastNew = {d:t, n:0}; S.lastNew.n++; }
  let gain = 3;
  if(c.box >= 5 && !c.m){ c.m = 1; gain += 20; }
  S.xp += gain;
  s.i++; s.lv = 0; s.rev = {}; s.showTr = false;
  if(s.i >= s.q.length){
    const full = s.full; UI.sess = null; save();
    if(full && !day().steps.hafal) completeStep("hafal"); else toast("Selesai · +" + gain + " XP");
  } else { save(); toast(gain > 3 ? "Hafalan lancar! +" + gain + " XP" : "+" + gain + " XP"); }
  rerender(); window.scrollTo(0,0);
}

const ACT = {
  tab: el => { if(el.dataset.tab === "materi" && TAB === "materi") UI.fig = null; go(el.dataset.tab); if(el.dataset.scroll){ const t = document.getElementById(el.dataset.scroll); if(t) t.scrollIntoView({behavior:"smooth", block:"start"}); } },
  hadj: el => { S.hijriOffset = Math.max(-2, Math.min(2, S.hijriOffset + parseInt(el.dataset.v,10))); save(); rerender(); },
  timer: el => startTimer(el.dataset.id, parseInt(el.dataset.sec,10)),
  doneStep: el => { const id = el.dataset.id; if(id === "napas") saveBreath(); completeStep(id); UI.openStep = null; rerender(); },
  startHafal: () => startSession(),
  hafalOne: el => startSession([el.dataset.id]),
  openFig: el => { UI.fig = el.dataset.id; UI.quiz = false; go("materi"); window.scrollTo(0,0); },
  figBack: () => { UI.fig = null; rerender(); window.scrollTo(0,0); },
  grp: el => { UI.grp = el.dataset.g; rerender(); },
  quiz: () => { UI.quiz = !UI.quiz; rerender(); },
  unblur: el => { if(UI.quiz) el.classList.add("open"); },
  studied: el => {
    const id = el.dataset.id, t = dk(0);
    S.studiedOn = S.studiedOn || {};
    if(S.studiedOn[id] === t){ toast("Sudah dicatat hari ini"); return; }
    S.studiedOn[id] = t; S.studied[id] = (S.studied[id] || 0) + 1;
    addXP(10, "materi");
    if(focusFig().f.id === id && !day().steps.materi) completeStep("materi");
    rerender();
  },
  planGuru: el => { const f = FIG_BY[el.dataset.id]; guruSend("Rancang kerangka majlis 10–15 menit tentang " + f.n + " (" + f.when + ") memakai Kompas TANGIS. Tandai maqam dan dinamika per bagian ([jeda], [bisik], [naik]), dan beri tiga tiang pancang: kalimat pembuka, puncak, dan penutup.\n\nPegang fakta ini:\n- Ringkas: " + f.ringkas + "\n- Detail: " + f.detail.join("; ") + "\n- Titik pecah: " + f.titik + "\n- Catatan riwayat: " + f.catatan.join("; ")); },
  quizGuru: el => { const f = FIG_BY[el.dataset.id]; guruSend("Uji penguasaan saya tentang " + f.n + ": ajukan satu pertanyaan tentang peristiwa, detail, tanggal, atau sumbernya. Tunggu jawaban saya, koreksi, lalu lanjut. Total lima pertanyaan. Fakta rujukan: " + f.ringkas + " Sumber: " + f.sumber.join("; ") + ". Catatan: " + f.catatan.join("; ")); },
  sponFig: el => { UI.spon = newSpon(el.dataset.id); UI.sponText = ""; UI.fb = ""; UI.fbErr = ""; UI.latih = "spontan"; go("latih"); },
  goSpontan: () => { UI.spon = newSpon(focusFig().f.id); UI.sponText = ""; UI.fb = ""; UI.fbErr = ""; UI.latih = "spontan"; go("latih"); },
  sub: el => { UI.latih = el.dataset.s; rerender(); },
  sponNew: () => { stopTimer(); UI.spon = newSpon(); UI.fb = ""; UI.fbErr = ""; rerender(); },
  sponFocus: () => { stopTimer(); UI.spon = newSpon(focusFig().f.id); UI.fb = ""; UI.fbErr = ""; rerender(); },
  sponDone: () => {
    S.spontan++; addXP(15, "latihan spontan");
    if(!day().steps.spontan) completeStep("spontan");
    stopTimer(); UI.spon = newSpon(); UI.sponText = ""; UI.fb = ""; UI.fbErr = ""; rerender();
  },
  sponFb: () => sponFeedback(),
  fbStop: () => { if(FB_CTL) FB_CTL.abort(); },
  rev: el => { UI.sess.rev[el.dataset.k] = 1; rerender(); },
  revAll: () => { const h = HAFAL_BY[UI.sess.q[UI.sess.i]]; h.ar.split("\n").forEach((l,li) => l.split(" ").filter(Boolean).forEach((w,wi) => { UI.sess.rev[li+"-"+wi] = 1; })); rerender(); },
  lvl: el => { UI.sess.lv = parseInt(el.dataset.l,10); UI.sess.rev = {}; rerender(); },
  showTr: () => { UI.sess.showTr = !UI.sess.showTr; rerender(); },
  rate: el => rate(el.dataset.r),
  endSess: () => { UI.sess = null; rerender(); },
  saveBait: () => {
    const t = (UI.bait || "").trim(); if(t.length < 10){ toast("Tulis baitnya dulu"); return; }
    S.baits.push({d:dk(0), t, w:daily().words.map(w => w[0])}); UI.bait = "";
    if(!day().steps.diksi) completeStep("diksi"); else { save(); toast("Bait tersimpan"); }
    rerender();
  },
  saveJ: () => {
    const j = UI.j; if(!(j.tema + j.titik + j.ok + j.fix).trim()){ toast("Isi catatannya dulu"); return; }
    S.journal.push({d:dk(0), tema:j.tema.trim(), titik:j.titik.trim(), ok:j.ok.trim(), fix:j.fix.trim()});
    UI.j = {tema:"", titik:"", ok:"", fix:""}; addXP(20, "catatan majlis"); rerender();
  },
  jGuru: () => { const last = S.journal.slice(-5).map(j => "- " + j.d + " | " + (j.tema||"Majlis") + " | titik pecah: " + (j.titik||"-") + " | berhasil: " + (j.ok||"-") + " | perbaiki: " + (j.fix||"-")).join("\n"); guruSend("Analisis catatan majlis saya berikut. Temukan pola: di mana jamaah biasanya pecah, kebiasaan yang perlu diubah, dan tiga latihan khusus untuk minggu ini.\n\n" + last); },
  starter: el => {
    const ff = focusFig().f.n;
    const st = [
      "Bedah teks maqtal/syair berikut. Tandai struktur TANGIS, titik pecah, jeda, dinamika, dan maqam per bagian. Tunjukkan riwayat yang lemah bila ada.\n\nTeks:\n",
      "Beri saya satu tantangan spontan tentang " + ff + ". Setelah saya menjawab, nilai dengan Kompas TANGIS.",
      "Uji penguasaan sumber saya tentang " + ff + ": ajukan satu pertanyaan, tunggu jawaban saya, koreksi, lalu lanjut. Total lima pertanyaan.",
      "Bantu saya menulis bait syair duka (rima a-a-a-a) tentang: ",
      "Saya sudah 8 tahun tampil sebagai pemaqtal/radud. Ajukan 5 pertanyaan diagnosa satu per satu untuk menemukan kelemahan terbesar saya, lalu buat rencana latihan 14 hari."
    ][parseInt(el.dataset.i,10)];
    UI.guruIn = st; rerender();
    const t = document.getElementById("guruIn"); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  },
  guruSend: () => guruSend(UI.guruIn),
  guruStop: () => { if(GURU_CTL) GURU_CTL.abort(); },
  clearAsk: () => { UI.clearAsk = true; rerender(); },
  clearNo: () => { UI.clearAsk = false; rerender(); },
  clearYes: () => { S.chat = []; UI.clearAsk = false; save(); rerender(); },
  hideInstall: () => { S.hideInstall = 1; save(); rerender(); },
  bkOut: () => {
    if(UI.bk === "out"){ UI.bk = null; rerender(); return; }
    UI.bk = "out"; const txt = JSON.stringify(S);
    try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Cadangan disalin"), () => {}); }catch(e){}
    rerender();
    const t = document.getElementById("bkOutTxt"); if(t){ try{ t.focus(); t.select(); }catch(e){} }
  },
  bkIn: () => { UI.bk = UI.bk === "in" ? null : "in"; UI.bkConfirm = false; UI.bkErr = ""; rerender(); },
  bkCheck: () => { if(parseBackup(UI.bkText)){ UI.bkConfirm = true; UI.bkErr = ""; } else { UI.bkErr = "Teks cadangan tidak dikenali. Pastikan seluruh teks tersalin."; UI.bkConfirm = false; } rerender(); },
  bkNo: () => { UI.bkConfirm = false; rerender(); },
  bkYes: () => {
    const o = parseBackup(UI.bkText); if(!o) return;
    S = Object.assign(clone(DEFAULT), o); UI.bk = null; UI.bkText = ""; UI.bkConfirm = false;
    save(); toast("Progres dipulihkan"); rerender();
  },
  dict: el => {
    if(!DICT) return;
    if(DICT_ON){ DICT.stop().catch(()=>{}); return; }
    DICT_T = el.dataset.t;
    DICT.start().catch(e => { if(e && (e.code === "not_granted" || e.code === "unavailable")){ DICT = null; rerender(); } else if(e && e.code !== "stopped" && e.code !== "dismissed") toast("Dikte tidak bisa dimulai"); });
  }
};
function saveBreath(){
  const v = parseInt(UI.breath, 10);
  if(v > 0 && v < 600){ if(v > (S.breathBest||0)){ S.breathBest = v; toast("Rekor baru: " + v + " detik"); } UI.breath = ""; }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;
  if(a === "pre" || a === "sc") return; /* checkboxes handled on change */
  if(ACT[a]){ if(el.tagName === "BUTTON" || el.tagName === "A") e.preventDefault(); ACT[a](el, e); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset && el.dataset.act === "pre"){ const d = day(); d.pre = d.pre || {}; d.pre[el.dataset.i] = el.checked ? 1 : 0; save(); }
  if(el.dataset && el.dataset.act === "sc"){ UI.spon.sc = UI.spon.sc || {}; UI.spon.sc[el.dataset.i] = el.checked; }
});
document.addEventListener("input", e => {
  const el = e.target, id = el.id;
  if(id === "figQ"){ UI.q = el.value; rerender(); }
  else if(id === "sponIn") UI.sponText = el.value;
  else if(id === "guruIn") UI.guruIn = el.value;
  else if(id === "baitIn") UI.bait = el.value;
  else if(id === "breathIn") UI.breath = el.value;
  else if(id === "jTema") UI.j.tema = el.value;
  else if(id === "jTitik") UI.j.titik = el.value;
  else if(id === "jOk") UI.j.ok = el.value;
  else if(id === "jFix") UI.j.fix = el.value;
  else if(id === "bkInTxt") UI.bkText = el.value;
});
document.addEventListener("toggle", e => {
  const el = e.target;
  if(el.classList && el.classList.contains("step") && el.dataset.step){ if(el.open) UI.openStep = el.dataset.step; else if(UI.openStep === el.dataset.step) UI.openStep = null; }
}, true);
document.addEventListener("keydown", e => {
  if(e.target && e.target.id === "guruIn" && e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); guruSend(UI.guruIn); }
});

function fromHash(){ const h = (location.hash || "").replace("#",""); if(TABS.some(t => t.id === h)) TAB = h; }
window.addEventListener("hashchange", () => { const prev = TAB; fromHash(); if(TAB !== prev){ rerender(); window.scrollTo(0,0); } });
fromHash();
rerender();
initCaps();
if(!IS_CLAUDE && !IS_APK && "serviceWorker" in navigator && location.protocol === "https:"){ try{ navigator.serviceWorker.register("sw.js").catch(() => {}); }catch(e){} }
</script>
