<style>
/* Layout: aplikasi satu kolom ala HP — header tipis, isi bergulir, tab bawah tetap. Hitam-hijau kain majlis, emas dharih, merah darah untuk titik pecah. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --surface2:#E7EAE4; --line:#D3D8CF;
  --fg:#16201B; --muted:#58645C;
  --gold:#86651E; --gold-ink:#FFFFFF; --gold-soft:#F2E9D3;
  --crimson:#9A1B2D; --crimson-soft:#F7E3E5;
  --green:#1F6B4C; --green-soft:#DDEFE6;
  --f-display:"Marcellus","Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1210; --surface:#141B18; --surface2:#1B2420; --line:#28332E;
    --fg:#E8E5DC; --muted:#99A49D;
    --gold:#D4AF5F; --gold-ink:#17130A; --gold-soft:#2A2416;
    --crimson:#E46876; --crimson-soft:#371A1F;
    --green:#62C497; --green-soft:#16302A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1210; --surface:#141B18; --surface2:#1B2420; --line:#28332E;
  --fg:#E8E5DC; --muted:#99A49D;
  --gold:#D4AF5F; --gold-ink:#17130A; --gold-soft:#2A2416;
  --crimson:#E46876; --crimson-soft:#371A1F;
  --green:#62C497; --green-soft:#16302A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.lvchip{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:22px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:4px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted);cursor:pointer;min-height:56px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--gold);font-weight:600}

/* type */
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px;line-height:1.2}
h3{font-size:17px;line-height:1.3}
p{margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:25px;line-height:2.05;unicode-bidi:isolate}
.ar.sm{font-size:20px;line-height:1.9}
.tr{font-style:italic;color:var(--muted);font-size:14px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{font-size:12.5px;color:var(--muted)}
.callout{border-left:3px solid var(--crimson);background:var(--crimson-soft);border-radius:0 10px 10px 0;padding:12px 14px}
.callout.gold{border-left-color:var(--gold);background:var(--gold-soft)}
.callout.green{border-left-color:var(--green);background:var(--green-soft)}
.callout .eyebrow{margin-bottom:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crimson);border-color:var(--crimson);background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.pill.hot{background:var(--crimson);color:#fff}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--green-soft);color:var(--green)}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px}
.hdate{font-family:var(--f-display);font-size:34px;line-height:1.1}
.hdate .arm{font-family:var(--f-ar);font-size:22px;color:var(--gold);margin-left:6px}
.adj{display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.adj button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;line-height:1}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}

/* steps */
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.step>summary::-webkit-details-marker{display:none}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.step.done .tick{background:var(--green);border-color:var(--green);color:var(--bg)}
.step .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.step summary .t{font-weight:600}
.step summary .s{font-size:12.5px;color:var(--muted)}
.niat{font-family:var(--f-display);font-size:20px;line-height:1.4}

/* timer */
.timer{display:flex;align-items:center;gap:10px}
.timer .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:62px}

/* agenda */
.agenda .row{cursor:pointer}
.datebox{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--surface2);padding:6px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--f-display);font-size:20px;font-weight:400}
.datebox span{font-size:10px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}

/* materi */
.fig-h{display:flex;flex-direction:column;gap:4px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.quiz .blk{position:relative;cursor:pointer}
.quiz .blk:not(.open)>.inner{filter:blur(7px);user-select:none;pointer-events:none}
.quiz .blk:not(.open)::after{content:"Ketuk untuk membuka";position:absolute;inset:auto 0 50% 0;text-align:center;font-size:13px;font-weight:600;color:var(--fg)}
.back{background:none;border:0;color:var(--gold);font-weight:600;padding:6px 0;cursor:pointer;align-self:flex-start}
input[type=search],input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:11px;padding:11px 12px;font-size:15px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}

/* hafalan */
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.arl{display:block}
.w{font:inherit;background:none;border:0;padding:0 1px;color:inherit}
button.w{cursor:pointer;color:var(--gold);border-bottom:1.5px dashed var(--gold);border-radius:0}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.levels .chip{text-align:center;padding:8px 4px;font-size:12.5px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{width:100%}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:11px 13px;border-radius:14px;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--gold-soft);border:1px solid var(--line);white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.a p+p,.msg.a p+ul,.msg.a ul+p{margin-top:8px}
.msg.a ul{margin:6px 0;padding-left:18px}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:64px}
.mic{width:42px;min-height:42px;padding:0}
.mic.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.hint{font-size:12.5px;color:var(--muted);min-height:1em}

/* ladder */
.ladder .row{cursor:default}
.lvnum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);border:1.5px solid var(--line)}
.ladder .reached .lvnum{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.ladder .now .lvnum{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}

.check{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--gold);flex:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);transition:opacity .25s}
.toast[hidden]{display:none}
.tanc{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.tanc b{font-family:var(--f-display);font-size:28px;color:var(--gold);line-height:1;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

const FIG = [
/* ---------- 14 MAKSUMIN ---------- */
{id:"nabi", g:"maksumin", n:"Nabi Muhammad ﷺ", ar:"مُحَمَّدٌ رَسُولُ اللَّهِ ﷺ", when:"28 Safar 11 H · Madinah", ev:[{m:2,d:28,l:"Wafat Rasulullah ﷺ"}],
 ringkas:"Hari-hari terakhir Rasulullah dilalui dalam sakit yang berat, dan Fatimah tak beranjak dari sisinya. Beliau membisikkan sesuatu hingga Fatimah menangis, lalu berbisik lagi hingga ia tersenyum: kabar bahwa dialah keluarga pertama yang akan menyusul. Menurut riwayat Ahlul Bait, beliau wafat dalam dekapan Imam Ali.",
 detail:["Bejana air di sisi ranjang: beliau mencelupkan tangan lalu mengusap wajahnya sendiri.","Fatimah berbisik lirih, “Duhai derita ayahku.”","Dua bisikan: yang pertama membuat Fatimah menangis, yang kedua membuatnya tersenyum.","Pintu rumah Fatimah, yang setelah hari itu menjadi saksi duka berikutnya."],
 titik:"“Tidak ada lagi derita atas ayahmu setelah hari ini.” Derita sang ayah selesai; derita putrinya baru dimulai.",
 maqam:"Hijaz untuk suasana khidmat dan rindu; turun ke Saba di penutup.",
 sumber:["Shahih Bukhari, Kitab al-Maghazi (bab sakit dan wafat Nabi)","Al-Irsyad — Syekh Mufid","Bihar al-Anwar — Allamah Majlisi"],
 catatan:["28 Safar mengikuti pendapat masyhur ulama Syiah; sumber Sunni umumnya menyebut 12 Rabiul Awal.","Riwayat tentang di pangkuan siapa beliau wafat berbeda antara sumber Sunni dan Syiah. Di majlis umum, fokus pada duka dan akhlak beliau."],
 hafal:["nabi1","nabi2"]},

{id:"fatimah", g:"maksumin", n:"Sayyidah Fatimah az-Zahra", ar:"فَاطِمَةُ الزَّهْرَاءُ", when:"13 Jumadil Ula atau 3 Jumadil Akhir 11 H · Madinah", ev:[{m:5,d:13,l:"Fatimiyah I (riwayat 75 hari)"},{m:6,d:3,l:"Fatimiyah II (riwayat 95 hari)"}],
 ringkas:"Setelah ayahnya wafat, hari-hari Fatimah dipenuhi duka. Imam Ali membangunkan untuknya Baitul Ahzan, rumah duka di Baqi, tempat ia menangisi ayahnya. Ia wafat sangat muda, sekitar 18 tahun. Sesuai wasiatnya, ia dimandikan dan dimakamkan malam hari secara diam-diam, dan makamnya hingga kini tak diketahui pasti.",
 detail:["Baitul Ahzan di Baqi, tempat tangisnya tak lagi dikeluhkan orang.","Wasiat: dimakamkan malam hari, tanpa diketahui orang-orang tertentu.","Makam yang hingga hari ini tak bertanda pasti.","Imam Ali berdiri di sisi kubur dan berbicara kepada Rasulullah.","Dalam riwayat Syiah: peristiwa di pintu rumah dan gugurnya janin Muhsin."],
 titik:"Malam itu Imam Ali berkata kepada Rasulullah: kesabaranku atas kepergian putri pilihanmu telah berkurang.",
 maqam:"Saba yang lirih; Nahawand saat mengenang kebersamaan dengan ayahnya.",
 sumber:["Nahjul Balaghah — ucapan Imam Ali saat memakamkan Fatimah","Al-Kafi — Syekh Kulaini","Al-Amali — Syekh Mufid","Bihar al-Anwar"],
 catatan:["Ada dua riwayat lama hidupnya setelah Nabi (75 dan 95 hari), karena itu Fatimiyah diperingati dua kali.","Riwayat peristiwa di pintu rumah sensitif di majlis campuran. Sampaikan dengan sumber dan adab."],
 hafal:["fat1","fat2"]},

{id:"ali", g:"maksumin", n:"Imam Ali bin Abi Thalib", ar:"عَلِيُّ بْنُ أَبِي طَالِبٍ", when:"21 Ramadhan 40 H · Kufah", ev:[{m:9,d:19,l:"Imam Ali ditebas di mihrab"},{m:9,d:21,l:"Syahadah Imam Ali"}],
 ringkas:"Pada malam 19 Ramadhan beliau berbuka di rumah putrinya, Ummu Kultsum, lalu berangkat ke Masjid Kufah sebelum subuh. Di mihrab, Abdurrahman bin Muljam menebas kepalanya dengan pedang beracun. Dua hari kemudian beliau wafat, setelah berwasiat agar pembunuhnya diperlakukan adil.",
 detail:["Dua hidangan di meja berbuka; ia meminta salah satunya diangkat.","Malam itu ia berkali-kali keluar memandang langit.","Angsa-angsa di halaman berteriak menghalangi langkahnya; ia berkata, biarkan, itu teriakan yang akan diikuti ratapan.","Darah di mihrab Masjid Kufah.","Wasiat: satu tebasan dibalas satu tebasan, dan jangan merusak jasadnya."],
 titik:"Saat darah membasahi janggutnya, kalimat pertamanya justru kemenangan: “Demi Tuhan Ka’bah, aku telah menang.”",
 maqam:"Bayati untuk kisah malam terakhir, Saba saat tebasan dan wasiat.",
 sumber:["Al-Irsyad — Syekh Mufid","Maqatil ath-Thalibiyyin — Abul Faraj al-Isfahani","Nahjul Balaghah, surat 47 (wasiat kepada Hasan dan Husain)","Bihar al-Anwar"],
 catatan:["Kisah anak-anak yatim Kufah membawa susu ke rumahnya masyhur di mimbar, tetapi sumbernya belakangan. Bawakan sebagai “diriwayatkan”, bukan kepastian."],
 hafal:["ali1"]},

{id:"hasan", g:"maksumin", n:"Imam Hasan al-Mujtaba", ar:"الْحَسَنُ الْمُجْتَبَى", when:"7 Safar (sebagian: 28 Safar) 50 H · Madinah", ev:[{m:2,d:7,l:"Syahadah Imam Hasan"}],
 ringkas:"Beliau diracun oleh istrinya, Ja’dah binti Asy’ats, atas hasutan Muawiyah. Racun itu mengoyak isi perutnya hingga ia memuntahkan darah. Ia berwasiat agar jenazahnya dibawa ke makam kakeknya tanpa menumpahkan darah. Iring-iringan itu dihadang, kerandanya dihujani anak panah, dan ia dimakamkan di Baqi.",
 detail:["Bejana di sisi ranjang tempat ia memuntahkan darah akibat racun.","Husain duduk di sisinya, dan Hasan justru menangisi hari adiknya.","Wasiat agar tak setetes darah pun tertumpah karena pemakamannya.","Anak panah yang menancap di keranda."],
 titik:"Di ranjang kematiannya, ia menangisi adiknya: “Tiada hari seperti harimu, wahai Aba Abdillah.”",
 maqam:"Hijaz untuk wasiat dan perpisahan dua saudara.",
 sumber:["Al-Irsyad — Syekh Mufid","Al-Amali — Syekh Shaduq","Maqatil ath-Thalibiyyin","Al-Kafi"],
 catatan:["Tanggal wafat diperselisihkan (7 atau 28 Safar).","Jumlah anak panah pada keranda berbeda antar riwayat. Cukup sebut “dihujani anak panah”."],
 hafal:["hasan1"]},

{id:"husain", g:"maksumin", n:"Imam Husain Sayyid asy-Syuhada", ar:"الْحُسَيْنُ سَيِّدُ الشُّهَدَاءِ", when:"10 Muharram 61 H · Karbala", ev:[{m:1,d:10,l:"Asyura — Syahadah Imam Husain"}],
 ringkas:"Bersama keluarga dan sekitar 72 sahabat, Imam Husain dikepung pasukan Umar bin Sa’ad di Karbala, dan air dihalangi sejak 7 Muharram. Pada hari Asyura, satu per satu sahabat dan keluarganya gugur. Akhirnya beliau sendirian, berseru mencari pembela, lalu gugur kehausan. Kepalanya diangkat di ujung tombak, kemah-kemah dibakar, dan keluarganya ditawan.",
 detail:["Malam Asyura: doa dan bacaan Quran para sahabat terdengar seperti dengung lebah.","Ia meminta penundaan satu malam untuk shalat, berdoa, dan membaca Quran.","Ia meminta pakaian usang yang tak diinginkan siapa pun dan merobeknya agar tak dirampas, namun tetap dirampas.","Kudanya kembali ke kemah tanpa penunggang, surainya basah darah.","Anak-anak menangis kehausan di balik kemah sejak hari ketujuh."],
 titik:"Ia berseru, “Adakah pembela bagi keluarga Rasulullah?” Yang menjawab dari kemah hanya tangis perempuan dan anak-anak.",
 maqam:"Bayati untuk pembuka, Hijaz untuk perjalanan dan perpisahan, Saba untuk puncak.",
 sumber:["Al-Luhuf — Sayyid Ibnu Thawus","Al-Irsyad — Syekh Mufid","Tarikh ath-Thabari (riwayat Abu Mikhnaf)","Kamil az-Ziyarat — Ibnu Qulawaih","Nafas al-Mahmum — Syekh Abbas Qummi"],
 catatan:["Angka 72 adalah yang masyhur; riwayat lain menyebut lebih.","Banyak tambahan dramatik di mimbar tak bersumber. Syahid Muthahhari mengkritiknya dalam Hamasah Husaini."],
 hafal:["hus1","hus2","hus3","hus4","hus5"]},

{id:"sajjad", g:"maksumin", n:"Imam Ali Zainal Abidin as-Sajjad", ar:"عَلِيُّ بْنُ الْحُسَيْنِ السَّجَّادُ", when:"25 Muharram 95 H · Madinah", ev:[{m:1,d:25,l:"Syahadah Imam Sajjad"}],
 ringkas:"Saksi hidup Karbala yang selamat karena sakit pada hari Asyura. Ia memimpin rombongan tawanan ke Kufah dan Syam dalam belenggu, dan berkhutbah di masjid Damaskus. Sisa hidupnya dipenuhi tangis dan doa yang terhimpun dalam Shahifah Sajjadiyah. Ia wafat diracun atas perintah Walid bin Abdul Malik.",
 detail:["Sakit yang membaringkannya di kemah pada hari Asyura.","Belenggu di lehernya dalam perjalanan ke Kufah dan Syam.","Khutbah di Damaskus: saat azan menyebut nama Muhammad, ia menoleh kepada Yazid, “Muhammad ini kakekku atau kakekmu?”","Bertahun-tahun ia menangis setiap kali melihat air dan makanan.","Ia membandingkan dirinya dengan Ya’qub yang kehilangan satu anak, sedang ia melihat ayah dan keluarganya disembelih di sekelilingnya."],
 titik:"Ya’qub kehilangan satu anak hingga matanya memutih. Ia melihat ayah, saudara, dan keluarganya disembelih di depan mata. Bagaimana dukanya bisa hilang?",
 maqam:"Hijaz untuk perjalanan tawanan; Rast untuk khutbah di Damaskus.",
 sumber:["Al-Irsyad — Syekh Mufid","Al-Luhuf (bagian perjalanan tawanan)","Bihar al-Anwar","Ash-Shahifah as-Sajjadiyah"],
 catatan:["Tanggal wafat juga diriwayatkan 12 Muharram, dan tahunnya 94 atau 95 H.","Kisah ia bertanya kepada tukang jagal apakah domba diberi minum sebelum disembelih populer, tetapi sumbernya lemah."],
 hafal:["sajjad1"]},

{id:"baqir", g:"maksumin", n:"Imam Muhammad al-Baqir", ar:"مُحَمَّدٌ الْبَاقِرُ", when:"7 Dzulhijjah 114 H · Madinah", ev:[{m:12,d:7,l:"Syahadah Imam Baqir"}],
 ringkas:"Pembelah ilmu (baqir al-‘ulum). Di Karbala ia masih anak kecil, sekitar empat tahun. Ia wafat diracun atas perintah Hisyam bin Abdul Malik, dan berwasiat agar sebagian hartanya dipakai untuk mengadakan ratapan baginya di Mina selama sepuluh musim haji.",
 detail:["Anak empat tahun di antara kemah-kemah yang terbakar.","Jabir bin Abdullah al-Anshari menyampaikan salam Rasulullah kepadanya.","Wasiat ratapan di Mina, di tengah jamaah haji, selama sepuluh tahun."],
 titik:"Ia meminta ratapan di Mina, di tengah lautan haji, agar duka Ahlul Bait tidak dilupakan.",
 maqam:"Bayati untuk kisah ilmu, Hijaz untuk wasiat.",
 sumber:["Al-Kafi (wasiat ratapan di Mina)","Al-Irsyad — Syekh Mufid","Bihar al-Anwar"],
 catatan:["Tahun wafat diperselisihkan (114 atau 117 H)."],
 hafal:[]},

{id:"shadiq", g:"maksumin", n:"Imam Ja’far ash-Shadiq", ar:"جَعْفَرٌ الصَّادِقُ", when:"25 Syawal 148 H · Madinah", ev:[{m:10,d:25,l:"Syahadah Imam Shadiq"}],
 ringkas:"Guru ribuan murid yang berkali-kali dipanggil dan diancam oleh Manshur al-Abbasi, lalu wafat diracun atas perintahnya. Menjelang wafat ia meminta seluruh kerabatnya dikumpulkan, memandang mereka satu per satu, lalu berwasiat tentang shalat.",
 detail:["Ummu Hamidah, istrinya, yang menceritakan saat-saat terakhir.","Ia membuka mata, meminta kerabat dikumpulkan, dan menatap mereka.","Rumah yang terus diawasi penguasa."],
 titik:"Wasiat terakhirnya bukan tentang dirinya, tapi tentang kita: “Syafaat kami tidak sampai kepada yang meremehkan shalat.”",
 maqam:"Bayati, lalu Hijaz di wasiat. Cocok untuk majlis yang mengajak muhasabah.",
 sumber:["Al-Kafi","Al-Amali — Syekh Shaduq","Al-Irsyad — Syekh Mufid"],
 catatan:["Duka yang berujung perbaikan diri. Tutup majlis ini dengan ajakan menjaga shalat."],
 hafal:["shadiq1"]},

{id:"kazhim", g:"maksumin", n:"Imam Musa al-Kazhim", ar:"مُوسَى الْكَاظِمُ", when:"25 Rajab 183 H · Baghdad", ev:[{m:7,d:25,l:"Syahadah Imam Kazhim"}],
 ringkas:"Bertahun-tahun ia dipindah dari satu penjara ke penjara lain atas perintah Harun. Gelarnya al-Kazhim, yang menahan amarah. Ia wafat diracun di penjara Sindi bin Syahik di Baghdad, dan jenazahnya diletakkan di jembatan Baghdad dengan seruan yang merendahkan.",
 detail:["Penjara Bashrah, lalu penjara-penjara Baghdad.","Dari atap, Harun melihat sesuatu seperti kain tergeletak di sel. Itu Imam dalam sujud panjang.","Belenggu berat di kakinya.","Jenazah di jembatan Baghdad, diumumkan dengan hinaan."],
 titik:"Yang disiksa di dasar penjara, yang betisnya remuk oleh belenggu, dan yang jenazahnya diumumkan dengan hinaan.",
 maqam:"Saba dari awal; ruang gelap dan sunyi.",
 sumber:["‘Uyun Akhbar ar-Ridha — Syekh Shaduq","Al-Irsyad — Syekh Mufid","Mafatih al-Jinan (shalawat dan ziarah Imam Kazhim)"],
 catatan:["Lamanya penahanan berbeda antar riwayat. Sebut “bertahun-tahun”."],
 hafal:["kazhim1"]},

{id:"ridha", g:"maksumin", n:"Imam Ali ar-Ridha", ar:"عَلِيُّ بْنُ مُوسَى الرِّضَا", when:"Akhir Safar 203 H · Thus (Masyhad)", ev:[{m:2,last:true,l:"Syahadah Imam Ridha"}],
 ringkas:"Ia dipaksa meninggalkan Madinah menuju Marw dan dijadikan putra mahkota oleh Ma’mun. Di Thus ia diracun dan wafat jauh dari keluarga. Karena itu ia digelari gharib al-ghuraba’, yang paling asing di antara yang terasing.",
 detail:["Sebelum berangkat, ia berulang kali ke makam Nabi dan menangis.","Ia meminta keluarganya meratapinya, karena tahu tak akan kembali.","Abu Shalt al-Harawi menemaninya hingga akhir di Thus.","Di’bil al-Khuza’i membacakan qasidah duka; Imam menangis dan menambahkan bait tentang “kubur di Thus”."],
 titik:"Di Thus, jauh dari Madinah, yang menemaninya hanya seorang sahabat, dan putranya yang datang dari kejauhan.",
 maqam:"Hijaz untuk keterasingan dan perjalanan jauh.",
 sumber:["‘Uyun Akhbar ar-Ridha — Syekh Shaduq","Al-Irsyad — Syekh Mufid"],
 catatan:["Tanggal wafat: akhir Safar (masyhur di Iran) atau 17 Safar.","Kisah kedatangan Imam Jawad di Thus berasal dari riwayat Abu Shalt dalam ‘Uyun."],
 hafal:["ridha1"]},

{id:"jawad", g:"maksumin", n:"Imam Muhammad al-Jawad", ar:"مُحَمَّدٌ الْجَوَادُ", when:"Akhir Dzulqa’dah 220 H · Baghdad", ev:[{m:11,last:true,l:"Syahadah Imam Jawad"}],
 ringkas:"Imam termuda, menjadi Imam di usia sekitar delapan tahun. Ia dipanggil ke Baghdad oleh Mu’tashim dan wafat diracun di usia sekitar 25 tahun, menurut riwayat melalui istrinya, Ummul Fadhl. Ia dimakamkan di samping kakeknya, Imam Kazhim.",
 detail:["Anak kecil yang menjawab pertanyaan ulama istana, Yahya bin Aktsam.","Usia dua puluh lima.","Kazhimain: kakek dan cucu berbaring berdampingan."],
 titik:"Usia dua puluh lima, usia ketika kebanyakan kita baru memulai hidup.",
 maqam:"Nahawand untuk masa kecilnya, Saba untuk wafatnya.",
 sumber:["Al-Irsyad — Syekh Mufid","Al-Kafi","Bihar al-Anwar"],
 catatan:["Rincian cara peracunan berbeda antar riwayat."],
 hafal:[]},

{id:"hadi", g:"maksumin", n:"Imam Ali al-Hadi", ar:"عَلِيٌّ الْهَادِي", when:"3 Rajab 254 H · Samarra", ev:[{m:7,d:3,l:"Syahadah Imam Hadi"}],
 ringkas:"Ia dipindahkan paksa dari Madinah ke Samarra dan hidup di bawah pengawasan militer selama sekitar dua puluh tahun. Suatu malam rumahnya digeledah dan ia dibawa ke majelis minum Mutawakkil. Diminta bersyair, ia membacakan syair tentang para raja yang kini terkubur, hingga Mutawakkil menangis. Ia wafat diracun.",
 detail:["Penggeledahan tengah malam; ia ditemukan sendirian menghadap kiblat.","Majelis minum sang khalifah.","Syair tentang istana yang ditinggalkan dan wajah-wajah yang kini dimakan tanah."],
 titik:"Dibawa ke majelis mabuk untuk dihina, ia justru membacakan syair tentang kubur, hingga yang mabuk pun menangis.",
 maqam:"Hijaz.",
 sumber:["Muruj adz-Dzahab — Al-Mas’udi","Al-Irsyad — Syekh Mufid"],
 catatan:["Ziarah Jami’ah Kabirah diajarkan oleh beliau. Bagus dihafal untuk majlisnya."],
 hafal:["hadi1"]},

{id:"askari", g:"maksumin", n:"Imam Hasan al-Askari", ar:"الْحَسَنُ الْعَسْكَرِيُّ", when:"8 Rabiul Awal 260 H · Samarra", ev:[{m:3,d:8,l:"Syahadah Imam Askari"}],
 ringkas:"Ia hidup di bawah pengawasan di garnisun (‘askar) Samarra, asal gelarnya, dan wafat diracun pada usia sekitar 28 tahun. Saat shalat jenazahnya, seorang anak kecil maju dan meminta pamannya, Ja’far, mundur. Anak itu adalah Imam Mahdi, dan sejak itu ghaibah dimulai.",
 detail:["Kota garnisun dan pengawasan yang tak putus.","Usia dua puluh delapan.","Seorang anak kecil menarik jubah pamannya: “Mundurlah, aku lebih berhak menyalati ayahku.”"],
 titik:"Anak kecil itu menyalati ayahnya, dan setelah hari itu ia tak lagi terlihat.",
 maqam:"Saba, lalu Hijaz menuju kerinduan kepada Imam Mahdi.",
 sumber:["Kamal ad-Din — Syekh Shaduq","Al-Irsyad — Syekh Mufid"],
 catatan:["Hadis “tanda mukmin ada lima”, termasuk ziarah Arbain, diriwayatkan dari beliau."],
 hafal:["askari1"]},

{id:"mahdi", g:"maksumin", n:"Imam al-Mahdi", ar:"الْمَهْدِيُّ الْمُنْتَظَرُ", when:"Lahir 15 Sya’ban 255 H · Samarra — ghaib", ev:[{m:8,d:15,l:"Kelahiran Imam Mahdi — majlis kerinduan"}],
 ringkas:"Imam yang hidup dan ghaib. Majlisnya bukan majlis syahadah, melainkan majlis kerinduan (nudbah). Dalam Doa Nudbah, para Imam disebut satu per satu lalu ditanyakan: di mana? Doa ini dibaca setiap Jumat pagi dan pada hari raya.",
 detail:["Rangkaian tanya “di mana” untuk setiap Imam.","“Di mana penuntut darah yang terbunuh di Karbala?”","Jumat pagi, jamaah yang menunggu."],
 titik:"“Berat bagiku melihat semua makhluk, sementara engkau tak terlihat.”",
 maqam:"Hijaz dan Nahawand: rindu, bukan ratap.",
 sumber:["Doa Nudbah — Mishbah az-Za’ir (Ibnu Thawus)","Mafatih al-Jinan"],
 catatan:["Majlis kerinduan cocok sebagai penutup rangkaian syahadah: membawa duka menuju harapan."],
 hafal:["mahdi1","mahdi2"]},

/* ---------- WANITA AGUNG ---------- */
{id:"zainab", g:"wanita", n:"Sayyidah Zainab al-Kubra", ar:"زَيْنَبُ الْكُبْرَى", when:"15 Rajab 62 H · Damaskus (pendapat lain: Kairo)", ev:[{m:7,d:15,l:"Wafat Sayyidah Zainab"}],
 ringkas:"Saksi Karbala dan juru bicaranya. Ia menjaga para perempuan dan anak-anak, melindungi Imam Sajjad, lalu berkhutbah di Kufah dan di istana Yazid. Ia mengubah barisan tawanan menjadi mimbar.",
 detail:["Tal Zainabiyah: bukit kecil tempat ia menyaksikan saudaranya.","Malam ke-11: kemah terbakar, ia mengumpulkan anak-anak yang tercerai di padang.","Riwayat masyhur: ia tetap shalat malam dalam perjalanan, dengan duduk karena letih.","Di istana Kufah ia berdiri tegak di hadapan Ibnu Ziyad.","Di istana Yazid, khutbahnya membungkam seisi istana."],
 titik:"Ditanya Ibnu Ziyad apa yang ia lihat dari perbuatan Allah atas saudaranya, ia menjawab, “Aku tidak melihat kecuali keindahan.”",
 maqam:"Saba di Tal Zainabiyah; Rast yang tegak untuk khutbah.",
 sumber:["Al-Luhuf — Ibnu Thawus","Al-Ihtijaj — Ath-Thabarsi","Balaghat an-Nisa’ — Ibnu Thaifur (khutbah Kufah)","Tarikh ath-Thabari"],
 catatan:["Tempat makam dan tanggal wafat diperselisihkan.","Jangan bawakan Zainab hanya sebagai sosok yang menangis. Kekuatannya adalah pesan Asyura."],
 hafal:["zainab1","zainab2","zainab3"]},

{id:"ummulbanin", g:"wanita", n:"Ummul Banin", ar:"أُمُّ الْبَنِينَ", when:"13 Jumadil Akhir (masyhur) · Madinah", ev:[{m:6,d:13,l:"Wafat Ummul Banin"}],
 ringkas:"Fatimah binti Hizam al-Kilabiyah, istri Imam Ali dan ibu Abbas, Abdullah, Ja’far, dan Utsman. Keempat putranya gugur di Karbala. Ia meminta agar tak lagi dipanggil Ummul Banin, ibu para putra, dan sering meratap di Baqi hingga orang yang memusuhi Ahlul Bait pun ikut menangis.",
 detail:["Basyir bin Hadzlam datang ke Madinah membawa kabar.","Setiap nama putranya diumumkan gugur, ia bertanya tentang Husain.","Ia pergi ke Baqi membawa cucu kecilnya, Ubaidullah putra Abbas.","Ratapannya membuat Marwan ikut menangis."],
 titik:"Setiap kali nama putranya disebut gugur, ia hanya bertanya: “Bagaimana kabar Husain?”",
 maqam:"Saba yang dalam, tempo lambat.",
 sumber:["Maqatil ath-Thalibiyyin — Abul Faraj al-Isfahani","Nafas al-Mahmum dan Muntaha al-Amal — Syekh Abbas Qummi"],
 catatan:["Dialog panjang dengan Basyir dan kisah menggambar lima kuburan di tanah berasal dari sumber belakangan.","Tahun wafat umumnya disebut 64 H."],
 hafal:["ub1"]},

/* ---------- SYUHADA KARBALA ---------- */
{id:"abbas", g:"karbala", n:"Abul Fadhl al-Abbas", ar:"أَبُو الْفَضْلِ الْعَبَّاسُ", when:"10 Muharram 61 H · Karbala (malam Tasu’a lazim dikhususkan)", ev:[{m:1,d:9,l:"Tasu’a — Abul Fadhl Abbas"}],
 ringkas:"Pembawa panji dan pembawa air, bulan Bani Hasyim. Ia membawa kirbat ke Furat untuk anak-anak yang kehausan. Sampai di air, ia tak minum karena teringat haus saudaranya. Dalam perjalanan kembali, kedua tangannya ditebas, kirbatnya tertembus panah, dan airnya tumpah.",
 detail:["Syimr membawa surat jaminan aman untuknya karena kekerabatan dari pihak ibu; ia menolaknya.","Air Furat di telapak tangannya; ia menuangkannya kembali.","Kirbat di pundak, yang ia jaga lebih dari tubuhnya sendiri.","Sakinah dan anak-anak menunggu di pintu kemah.","Imam Sajjad: Allah mengganti kedua tangannya dengan dua sayap, seperti Ja’far ath-Thayyar."],
 titik:"Air sudah di telapak tangannya, lalu ia menuangkannya kembali ke sungai.",
 maqam:"Bayati untuk keberangkatan, Hijaz di tepi Furat, Saba saat tangan ditebas.",
 sumber:["Al-Irsyad — Syekh Mufid","Maqatil ath-Thalibiyyin","Al-Luhuf","Al-Amali dan Al-Khishal — Syekh Shaduq (ucapan Imam Sajjad tentang dua sayap)"],
 catatan:["Detail menggigit kirbat dan sebagian rajaz berasal dari maqtal belakangan; riwayat awal lebih ringkas.","Hari dikhususkannya berbeda antar komunitas; di banyak majlis, Tasu’a (9 Muharram) adalah hari Abbas."],
 hafal:["abbas1","abbas2"]},

{id:"aliakbar", g:"karbala", n:"Ali al-Akbar", ar:"عَلِيٌّ الْأَكْبَرُ", when:"10 Muharram 61 H · Karbala", ev:[],
 ringkas:"Putra Imam Husain yang paling mirip Rasulullah, dan orang pertama dari Bani Hasyim yang gugur. Ayahnya memandangnya lama lalu menengadah ke langit. Ia kembali sekali mengeluh haus, lalu maju lagi hingga gugur dikeroyok. Ayahnya meletakkan pipinya di pipi putranya.",
 detail:["Ayahnya memandangnya lama, lalu menengadah ke langit.","“Ayah, haus membunuhku, dan beratnya besi melelahkanku.”","Menurut sebagian maqtal, Imam memberikan cincinnya untuk dikulum agar dahaganya reda sejenak.","Pipi ayah di pipi putranya."],
 titik:"“Ayah, haus membunuhku.” Dan ayahnya sendiri sama hausnya.",
 maqam:"Nahawand untuk kemiripannya dengan Nabi, Saba saat ia gugur.",
 sumber:["Al-Luhuf","Al-Irsyad — Syekh Mufid","Maqatil ath-Thalibiyyin"],
 catatan:["Usianya diperselisihkan (sekitar 18, 19, atau 25 tahun).","Di banyak majlis, malam ke-8 Muharram dikhususkan untuknya."],
 hafal:["akbar1","akbar2","akbar3"]},

{id:"qasim", g:"karbala", n:"Qasim bin Hasan", ar:"الْقَاسِمُ بْنُ الْحَسَنِ", when:"10 Muharram 61 H · Karbala", ev:[],
 ringkas:"Putra Imam Hasan yang masih remaja. Pamannya awalnya menolak izinnya karena usianya. Seorang perawi dari pasukan musuh menggambarkan wajahnya seperti belahan bulan, dengan tali sandal yang putus. Ia gugur, dan pamannya membawa jasadnya dengan kaki terseret di tanah.",
 detail:["Wajah seperti belahan bulan.","Tali sandal kirinya putus.","Ia memanggil pamannya saat jatuh.","Imam memikul jasadnya, kedua kakinya menyeret tanah, lalu membaringkannya di samping Ali Akbar."],
 titik:"Bahkan perawi dari pasukan musuh masih mengingat tali sandalnya yang putus.",
 maqam:"Nahawand.",
 sumber:["Tarikh ath-Thabari (riwayat Humaid bin Muslim)","Al-Irsyad — Syekh Mufid","Maqatil ath-Thalibiyyin"],
 catatan:["Kisah “pernikahan Qasim di Karbala” tidak bersumber kuat. Syahid Muthahhari dan Muhaddits Nuri mengkritiknya.","Ucapan “kematian lebih manis dari madu” masyhur, tetapi sumbernya belakangan.","Di banyak majlis, malam ke-6 Muharram dikhususkan untuknya."],
 hafal:["qasim1"]},

{id:"asghar", g:"karbala", n:"Ali al-Asghar (Abdullah ar-Radhi’)", ar:"عَبْدُ اللَّهِ الرَّضِيعُ", when:"10 Muharram 61 H · Karbala", ev:[],
 ringkas:"Bayi berusia sekitar enam bulan. Susu ibunya telah kering. Imam Husain menggendongnya ke hadapan pasukan untuk meminta air, lalu panah Harmalah menembus lehernya. Imam menampung darahnya dan melemparkannya ke langit, dan tak setetes pun kembali.",
 detail:["Rabab, ibunya, dan susu yang telah kering.","Bibir mungil yang pecah karena haus.","Panah Harmalah.","Darah yang dilempar ke langit dan tak kembali."],
 titik:"“Yang meringankan semua ini: ia terjadi di hadapan pandangan Allah.”",
 maqam:"Saba yang sangat lirih; nada nina bobo (Nahawand atau Kurd).",
 sumber:["Al-Luhuf","Al-Irsyad (menyebutnya Abdullah, terpanah di pangkuan ayahnya)","Tarikh ath-Thabari"],
 catatan:["Nama “Ali Asghar” populer; sumber awal menyebutnya Abdullah.","Dialog panjang Imam meminta air sering berupa tambahan mimbar. Pegang inti riwayatnya.","Di banyak majlis, malam ke-7 Muharram dikhususkan untuknya."],
 hafal:["asghar1"]},

{id:"hurr", g:"karbala", n:"Hurr bin Yazid ar-Riyahi", ar:"الْحُرُّ الرِّيَاحِيُّ", when:"10 Muharram 61 H · Karbala", ev:[],
 ringkas:"Komandan yang pertama menghadang rombongan Imam Husain. Pagi Asyura tubuhnya gemetar, lalu ia memacu kudanya ke kemah Husain dengan kepala tertunduk dan bertaubat. Ia meminta maju pertama dan gugur sebagai syahid.",
 detail:["Tubuh yang gemetar; temannya heran melihatnya.","“Adakah taubat bagiku?”","Yang kemarin menutup jalan, hari ini meminta maju pertama.","Dalam sebagian maqtal, Imam mengusap debu dan darah dari wajahnya."],
 titik:"Orang yang kemarin menutup jalan Husain, hari ini gugur di pangkuannya.",
 maqam:"Bayati, lalu Hijaz. Sangat cocok untuk jembatan taubat bagi jamaah.",
 sumber:["Al-Luhuf","Al-Irsyad — Syekh Mufid","Tarikh ath-Thabari","Al-Amali — Syekh Shaduq"],
 catatan:["Kisah Hurr adalah pintu terbaik untuk mengajak jamaah bertaubat. Jangan lewatkan jembatannya."],
 hafal:["hurr1"]},

{id:"habib", g:"karbala", n:"Habib bin Mazhahir", ar:"حَبِيبُ بْنُ مُظَاهِرٍ", when:"10 Muharram 61 H · Karbala", ev:[],
 ringkas:"Sahabat tua dari Kufah dan sahabat Imam Ali. Ia menyusup ke Karbala dan memimpin sayap kiri pasukan kecil Imam Husain. Gugurnya membuat Imam tampak terguncang.",
 detail:["Janggut putih, usia lanjut.","Ia datang menyusup ketika banyak orang Kufah memilih diam.","Saat ia gugur, Imam berkata bahwa kepada Allah ia menyerahkan dirinya dan para pembela sahabatnya."],
 titik:"Seorang tua yang bisa saja tinggal di rumah memilih Karbala.",
 maqam:"Bayati.",
 sumber:["Tarikh ath-Thabari","Al-Irsyad — Syekh Mufid","Rijal al-Kasyi"],
 catatan:["Cocok untuk jembatan kepada jamaah yang sudah berusia: tak ada kata terlambat untuk memilih."],
 hafal:[]},

{id:"abdullah", g:"karbala", n:"Abdullah bin Hasan", ar:"عَبْدُ اللَّهِ بْنُ الْحَسَنِ", when:"10 Muharram 61 H · Karbala", ev:[],
 ringkas:"Anak kecil putra Imam Hasan. Ketika melihat pamannya terkepung sendirian, ia lari dari kemah. Ia menahan sabetan pedang dengan tangannya, lalu gugur terpanah dalam pelukan Imam Husain.",
 detail:["Zainab berusaha menahannya di pintu kemah.","“Demi Allah, aku tak akan berpisah dari pamanku.”","Tangan kecil yang menahan pedang.","Ia gugur dalam pelukan pamannya."],
 titik:"Seorang anak berlari ke arah yang ditakuti semua orang dewasa.",
 maqam:"Kurd atau Nahawand, lalu Saba.",
 sumber:["Al-Luhuf","Al-Irsyad — Syekh Mufid","Tarikh ath-Thabari"],
 catatan:["Di banyak majlis, malam ke-5 Muharram dikhususkan untuknya."],
 hafal:[]},

/* ---------- ARBAIN ---------- */
{id:"arbain", g:"arbain", n:"Arbain Imam Husain", ar:"الْأَرْبَعِينُ", when:"20 Safar", ev:[{m:2,d:20,l:"Arbain Imam Husain"}],
 ringkas:"Empat puluh hari setelah Asyura. Jabir bin Abdullah al-Anshari, sahabat Nabi yang sudah buta, datang ke Karbala bersama Athiyyah al-Aufi. Ia mandi di Furat, memakai wewangian, berjalan pelan sambil berzikir, lalu meminta tangannya diletakkan di atas kubur. Ia pingsan, lalu memanggil “Ya Husain” tiga kali.",
 detail:["Seorang tua buta yang mandi di Furat sebelum mendekat.","Tangan yang meraba kubur.","Tiga panggilan yang tak terjawab.","Ia lalu menjawab sendiri: bagaimana engkau bisa menjawab, sedang urat lehermu telah terputus.","Hari ini, jutaan peziarah berjalan kaki dari Najaf ke Karbala."],
 titik:"“Kekasih tak menjawab kekasihnya?”",
 maqam:"Hijaz untuk perjalanan, Saba di sisi kubur.",
 sumber:["Bisyarah al-Mushthafa — Imaduddin ath-Thabari","Al-Luhuf","Tahdzib al-Ahkam dan Mishbah al-Mutahajjid — Syekh Thusi (ziarah Arbain)"],
 catatan:["Apakah rombongan tawanan kembali ke Karbala pada Arbain tahun 61 H diperselisihkan. Al-Luhuf menyebutnya, sebagian ulama seperti Muhaddits Nuri meragukannya."],
 hafal:["arbain1","arbain2","askari1"]},

/* ---------- SYUHADA AHLUL BAIT ---------- */
{id:"hamzah", g:"ahlulbait", n:"Hamzah bin Abdul Muthalib", ar:"حَمْزَةُ سَيِّدُ الشُّهَدَاءِ", when:"15 Syawal 3 H · Uhud", ev:[{m:10,d:15,l:"Syahadah Hamzah (Uhud)"}],
 ringkas:"Paman Nabi, singa Allah, Sayyid asy-Syuhada sebelum Karbala. Ia gugur di Uhud oleh tombak Wahsyi, lalu jasadnya dirusak. Nabi berdiri di sisinya dan menangis. Ketika rumah-rumah Anshar meratapi syuhada mereka, Nabi berkata bahwa Hamzah tak punya yang menangisinya.",
 detail:["Tombak lempar Wahsyi.","Jasad yang dirusak.","Nabi menangis di sisinya.","Sejak hari itu, perempuan Madinah meratapi Hamzah lebih dulu sebelum syuhada mereka sendiri."],
 titik:"“Tetapi Hamzah, tak ada yang menangisinya.” Sejak hari itu, Madinah belajar meratap untuk Hamzah lebih dulu.",
 maqam:"Hijaz.",
 sumber:["Sirah Ibnu Hisyam","Musnad Ahmad","Al-Maghazi — Al-Waqidi"],
 catatan:["Tanggal Uhud yang masyhur 15 Syawal; ada yang menyebut 7 Syawal.","Hadis ini dasar kuat bagi majlis ratapan, diterima Sunni dan Syiah."],
 hafal:["hamzah1"]},

{id:"jafar", g:"ahlulbait", n:"Ja’far ath-Thayyar", ar:"جَعْفَرٌ الطَّيَّارُ", when:"Jumadil Ula 8 H · Mu’tah", ev:[],
 ringkas:"Saudara Imam Ali dan sepupu Nabi. Di Mu’tah ia memegang panji dengan tangan kanan hingga putus, lalu dengan tangan kiri hingga putus, lalu mendekapnya dengan lengan sampai gugur. Nabi mengabarkan Allah menggantinya dengan dua sayap di surga.",
 detail:["Panji yang berpindah dari tangan ke tangan, lalu ke dada.","Dua sayap di surga.","Nabi mendatangi Asma’ binti Umais dan memeluk anak-anak Ja’far, matanya berlinang.","Nabi meminta keluarganya memasak untuk keluarga Ja’far karena mereka sedang berduka."],
 titik:"Nabi memeluk anak-anak Ja’far sebelum menyampaikan kabar, dan Asma’ pun tahu.",
 maqam:"Bayati, lalu Hijaz.",
 sumber:["Sirah Ibnu Hisyam","Maqatil ath-Thalibiyyin","Sunan at-Tirmidzi dan Sunan Abi Dawud (hadis memasak untuk keluarga Ja’far)"],
 catatan:["Jembatan indah ke Abbas: keduanya kehilangan dua tangan dan diganti dua sayap."],
 hafal:[]},

{id:"muslim", g:"ahlulbait", n:"Muslim bin Aqil", ar:"مُسْلِمُ بْنُ عَقِيلٍ", when:"9 Dzulhijjah 60 H · Kufah", ev:[{m:12,d:9,l:"Syahadah Muslim bin Aqil (hari Arafah)"}],
 ringkas:"Utusan Imam Husain ke Kufah. Ribuan orang membaiatnya, lalu menghilang dalam satu malam. Ia berjalan sendirian di lorong Kufah, diberi perlindungan oleh Thau’ah, lalu dikepung dan ditangkap dengan janji keamanan palsu. Di atap istana ia bertasbih dan bershalawat sebelum dijatuhkan.",
 detail:["Masjid yang penuh saat maghrib, kosong saat isya.","Lorong-lorong Kufah yang sepi.","Thau’ah berdiri di depan pintunya menunggu anaknya pulang, lalu menampung seorang asing.","Air yang ia minum bercampur darah; gigi depannya jatuh ke dalam cawan.","Ia menangis, bukan untuk dirinya."],
 titik:"“Aku tidak menangis untuk diriku. Aku menangis untuk Husain dan keluarganya yang sedang menuju ke sini.”",
 maqam:"Hijaz untuk keterasingan di lorong Kufah.",
 sumber:["Tarikh ath-Thabari","Al-Irsyad — Syekh Mufid","Maqatil ath-Thalibiyyin"],
 catatan:["Hani bin Urwah gugur bersamanya. Di banyak majlis, malam pertama atau kedua Muharram dikhususkan untuknya."],
 hafal:["muslim1"]},

{id:"tiflan", g:"ahlulbait", n:"Dua Putra Muslim", ar:"طِفْلَا مُسْلِمٍ", when:"Setelah Karbala · Kufah", ev:[],
 ringkas:"Muhammad dan Ibrahim, dua kakak-beradik kecil putra Muslim bin Aqil, ditawan setelah Karbala. Setelah lama di penjara mereka lolos dan berlindung di rumah seorang perempuan tua. Menantu perempuan itu menemukan mereka dan membunuh keduanya di tepi Furat demi hadiah.",
 detail:["Penjara yang lama dan makanan yang sedikit.","Malam terakhir: kakak dan adik berpelukan sebelum tidur.","Mereka meminta waktu untuk shalat.","Tepi Furat."],
 titik:"Malam terakhir, dua kakak-adik berpelukan dan saling menghibur sebelum tidur.",
 maqam:"Kurd atau Nahawand: sederhana, seperti cerita anak.",
 sumber:["Al-Amali — Syekh Shaduq"],
 catatan:["Kisah ini hanya tercatat dalam sumber yang terbatas, dan sebagian peneliti mempertanyakan rinciannya. Bawakan dengan “diriwayatkan”."],
 hafal:[]},

{id:"ruqayyah", g:"ahlulbait", n:"Sayyidah Ruqayyah", ar:"رُقَيَّةُ بِنْتُ الْحُسَيْنِ", when:"5 Safar (diperingati) · Damaskus", ev:[{m:2,d:5,l:"Wafat Sayyidah Ruqayyah"}],
 ringkas:"Putri kecil Imam Husain yang menurut riwayat wafat di reruntuhan Syam, setelah terbangun mencari ayahnya dan diberi nampan berisi kepala sang ayah. Makamnya di Damaskus dikunjungi banyak peziarah.",
 detail:["Reruntuhan tempat para tawanan ditampung di Syam.","Mimpi bertemu ayahnya.","Nampan yang ditutup kain."],
 titik:"Ia meminta ayahnya, dan yang datang adalah sebuah nampan.",
 maqam:"Kurd yang lirih, lalu Saba.",
 sumber:["Kamil al-Baha’i — Imaduddin ath-Thabari (abad ke-7 H)","Nafas al-Mahmum (menukil dari sumber belakangan)"],
 catatan:["Kisah ini tidak terdapat dalam sumber-sumber awal. Bawakan dengan “diriwayatkan”, jangan dengan kepastian."],
 hafal:[]},

{id:"zaid", g:"ahlulbait", n:"Zaid bin Ali", ar:"زَيْدُ بْنُ عَلِيٍّ", when:"Safar 122 H (sebagian: 121) · Kufah", ev:[],
 ringkas:"Putra Imam Sajjad yang bangkit di Kufah melawan kezaliman Bani Umayyah, lalu ditinggal sebagian besar pembaiatnya. Anak panah mengenai dahinya dan ia gugur. Ia dimakamkan diam-diam di dasar aliran air, tetapi ditemukan, jasadnya disalib di Kufah bertahun-tahun, lalu dibakar.",
 detail:["Panah di dahi; ia wafat saat panah itu dicabut.","Kubur rahasia di dasar aliran air.","Jasad yang disalib bertahun-tahun di Kufah."],
 titik:"Mereka bahkan tak membiarkan jasadnya beristirahat di bawah tanah.",
 maqam:"Hijaz, lalu Saba.",
 sumber:["Maqatil ath-Thalibiyyin","‘Uyun Akhbar ar-Ridha (pujian para Imam atasnya)"],
 catatan:["Tanggal pastinya tak disepakati, jadi tidak ditampilkan hitung mundur."],
 hafal:[]}
];

const HAFAL = [

 tr:"As-salāmu ‘alaika yā Abā ‘Abdillāh, as-salāmu ‘alaika yabna Rasūlillāh",

 m:"Wahai Aba Abdillah, sungguh agung duka ini. Besar dan agung musibahmu atas kami dan atas seluruh pemeluk Islam.",

{id:"hus5", f:"husain", t:"Ziarah Asyura: salam penutup",
 ar:"السَّلَامُ عَلَى الْحُسَيْنِ، وَعَلَى عَلِيِّ بْنِ الْحُسَيْنِ، وَعَلَى أَوْلَادِ الْحُسَيْنِ، وَعَلَى أَصْحَابِ الْحُسَيْنِ",

{id:"hus3", f:"husain", t:"Seruan Imam Husain",
 ar:"هَلْ مِنْ ذَابٍّ يَذُبُّ عَنْ حَرَمِ رَسُولِ اللَّهِ؟ هَلْ مِنْ مُوَحِّدٍ يَخَافُ اللَّهَ فِينَا؟",
 tr:"Hal min dzābbin yadzubbu ‘an harami Rasūlillāh? Hal min muwahhidin yakhāfullāha fīnā?",
 m:"Adakah pembela yang membela keluarga Rasulullah? Adakah seorang ahli tauhid yang takut kepada Allah dalam urusan kami?",
 s:"Al-Luhuf — Ibnu Thawus",
 n:"Kalimat populer “hal min nāshirin yanshurunā” adalah ringkasan lisan dari seruan ini."},
{id:"hus4", f:"husain", t:"Hadis Rayyan bin Syabib",
 ar:"يَا ابْنَ شَبِيبٍ، إِنْ كُنْتَ بَاكِيًا لِشَيْءٍ فَابْكِ لِلْحُسَيْنِ بْنِ عَلِيٍّ، فَإِنَّهُ ذُبِحَ كَمَا يُذْبَحُ الْكَبْشُ",
 tr:"Yabna Syabīb, in kunta bākiyan lisyai’in fabki lil-Husainibni ‘Aliyy, fa-innahū dzubiha kamā yudzbahul-kabsy",
 m:"Wahai putra Syabib, jika engkau hendak menangisi sesuatu, tangisilah Husain bin Ali, karena ia disembelih sebagaimana domba disembelih.",
 s:"Imam Ridha — ‘Uyun Akhbar ar-Ridha; Al-Amali (Syekh Shaduq)",
 n:"Hadis pegangan setiap pemaqtal: inilah alasan majlis ini ada."},
{id:"asghar1", f:"asghar", t:"Imam Husain atas Ali Asghar",
 ar:"هَوَّنَ عَلَيَّ مَا نَزَلَ بِي أَنَّهُ بِعَيْنِ اللَّهِ",
 tr:"Hawwana ‘alayya mā nazala bī annahū bi‘ainillāh",
 m:"Yang meringankan musibah yang menimpaku: semua ini terjadi di hadapan pandangan Allah.",
 s:"Al-Luhuf — Ibnu Thawus"},
{id:"akbar1", f:"aliakbar", t:"Doa Imam saat Ali Akbar maju",
 ar:"اللَّهُمَّ اشْهَدْ عَلَى هَؤُلَاءِ الْقَوْمِ، فَقَدْ بَرَزَ إِلَيْهِمْ غُلَامٌ أَشْبَهُ النَّاسِ خَلْقًا وَخُلُقًا وَمَنْطِقًا بِرَسُولِكَ",
 tr:"Allāhummasyhad ‘alā hā’ulā’il-qaum, faqad baraza ilaihim ghulāmun asybahun-nāsi khalqan wa khuluqan wa manthiqan bi rasūlik",
 m:"Ya Allah, saksikanlah kaum ini: telah maju menghadapi mereka seorang pemuda yang paling mirip dengan Rasul-Mu dalam rupa, akhlak, dan tutur katanya.",
 s:"Al-Luhuf — Ibnu Thawus"},
{id:"akbar3", f:"aliakbar", t:"Keluhan Ali Akbar",
 ar:"يَا أَبَهْ، الْعَطَشُ قَدْ قَتَلَنِي، وَثِقَلُ الْحَدِيدِ قَدْ أَجْهَدَنِي",
 tr:"Yā abah, al-‘athasyu qad qatalanī, wa tsiqalul-hadīdi qad ajhadanī",
 m:"Wahai ayah, haus telah membunuhku, dan beratnya besi telah melelahkanku.",
 s:"Al-Luhuf — Ibnu Thawus"},
{id:"akbar2", f:"aliakbar", t:"Imam di sisi jasad Ali Akbar",
 ar:"عَلَى الدُّنْيَا بَعْدَكَ الْعَفَا",
 tr:"‘Alad-dunyā ba‘dakal-‘afā",
 m:"Setelah kepergianmu, binasalah dunia ini.",
 s:"Al-Irsyad — Syekh Mufid; Tarikh ath-Thabari"},
{id:"abbas1", f:"abbas", t:"Imam Husain atas Abbas",
 ar:"الْآنَ انْكَسَرَ ظَهْرِي، وَقَلَّتْ حِيلَتِي",
 tr:"Al-āna inkasara zhahrī, wa qallat hīlatī",
 m:"Kini patahlah punggungku, dan habislah dayaku.",
 s:"Bihar al-Anwar; Nafas al-Mahmum"},
{id:"abbas2", f:"abbas", t:"Rajaz Abbas di tepi Furat",
 ar:"يَا نَفْسُ مِنْ بَعْدِ الْحُسَيْنِ هُونِي، وَبَعْدَهُ لَا كُنْتِ أَنْ تَكُونِي",
 tr:"Yā nafsu min ba‘dil-Husaini hūnī, wa ba‘dahū lā kunti an takūnī",
 m:"Wahai diriku, setelah Husain hinalah engkau; setelahnya, tak pantas engkau tetap ada.",
 s:"Masyhur dalam kitab-kitab maqtal",
 n:"Sanadnya tidak sekuat riwayat Al-Irsyad. Bawakan sebagai syair yang masyhur dinisbatkan kepada Abbas."},
{id:"qasim1", f:"qasim", t:"Jawaban Qasim tentang kematian",
 ar:"يَا عَمِّ، أَحْلَى مِنَ الْعَسَلِ",
 tr:"Yā ‘ammi, ahlā minal-‘asal",
 m:"Wahai paman, (kematian bagiku) lebih manis dari madu.",
 s:"Masyhur di mimbar; dinukil dalam sumber belakangan",
 n:"Bawakan dengan “diriwayatkan”. Sumbernya jauh lebih belakangan dari Al-Irsyad dan Thabari."},
{id:"hurr1", f:"hurr", t:"Imam Husain kepada Hurr",
 ar:"أَنْتَ الْحُرُّ كَمَا سَمَّتْكَ أُمُّكَ، وَأَنْتَ الْحُرُّ فِي الدُّنْيَا وَالْآخِرَةِ",
 tr:"Antal-hurru kamā sammatka ummuk, wa antal-hurru fid-dunyā wal-ākhirah",
 m:"Engkau merdeka sebagaimana ibumu menamaimu. Engkau merdeka di dunia dan di akhirat.",
 s:"Al-Luhuf; Al-Amali (Syekh Shaduq)"},
{id:"zainab1", f:"zainab", t:"Ratapan Zainab di medan",
 ar:"يَا مُحَمَّدَاهُ، صَلَّى عَلَيْكَ مَلِيكُ السَّمَاءِ، هَذَا حُسَيْنٌ بِالْعَرَاءِ، مُرَمَّلٌ بِالدِّمَاءِ، مُقَطَّعُ الْأَعْضَاءِ",
 tr:"Yā Muhammadāh, shallā ‘alaika malīkus-samā’, hādzā Husainun bil-‘arā’, murammalun bid-dimā’, muqaththa‘ul-a‘dhā’",
 m:"Wahai Muhammad! Semoga Raja langit bershalawat atasmu. Inilah Husain di tanah terbuka, berlumur darah, tercabik anggota tubuhnya.",
 s:"Al-Luhuf; Tarikh ath-Thabari (riwayat Abu Mikhnaf)"},
{id:"zainab2", f:"zainab", t:"Jawaban Zainab kepada Ibnu Ziyad",
 ar:"مَا رَأَيْتُ إِلَّا جَمِيلًا",
 tr:"Mā ra’aitu illā jamīlā",
 m:"Aku tidak melihat kecuali keindahan.",
 s:"Al-Luhuf — Ibnu Thawus"},
{id:"zainab3", f:"zainab", t:"Khutbah Zainab di istana Yazid",
 ar:"فَكِدْ كَيْدَكَ، وَاسْعَ سَعْيَكَ، وَنَاصِبْ جُهْدَكَ، فَوَاللَّهِ لَا تَمْحُو ذِكْرَنَا، وَلَا تُمِيتُ وَحْيَنَا",
 tr:"Fakid kaidak, wasa‘ sa‘yak, wa nāshib juhdak, fawallāhi lā tamhū dzikranā, wa lā tumītu wahyanā",
 m:"Lakukan tipu dayamu, kerahkan usahamu, curahkan seluruh tenagamu. Demi Allah, engkau takkan bisa menghapus sebutan kami, dan takkan bisa mematikan wahyu kami.",
 s:"Al-Ihtijaj — Ath-Thabarsi; Al-Luhuf"},
{id:"ub1", f:"ummulbanin", t:"Ratapan Ummul Banin di Baqi",
 ar:"لَا تَدْعُوِنِّي وَيْكِ أُمَّ الْبَنِينْ، تُذَكِّرِينِي بِلُيُوثِ الْعَرِينْ\nكَانَتْ بَنُونٌ لِي أُدْعَى بِهِمْ، وَالْيَوْمَ أَصْبَحْتُ وَلَا مِنْ بَنِينْ",
 tr:"Lā tad‘uwinnī waiki Ummal-Banīn, tudzakkirīnī biluyūtsil-‘arīn / Kānat banūnun lī ud‘ā bihim, wal-yauma ashbahtu wa lā min banīn",
 m:"Jangan panggil aku Ummul Banin, kau mengingatkanku pada singa-singa di sarangnya. Dulu aku punya putra-putra yang membuatku dipanggil begitu; hari ini aku tak lagi punya putra.",
 s:"Masyhur dalam kitab maqtal; ratapannya di Baqi disebut dalam Maqatil ath-Thalibiyyin"},
{id:"fat1", f:"fatimah", t:"Syair Fatimah di makam ayahnya",
 ar:"مَاذَا عَلَى مَنْ شَمَّ تُرْبَةَ أَحْمَدٍ، أَنْ لَا يَشَمَّ مَدَى الزَّمَانِ غَوَالِيَا\nصُبَّتْ عَلَيَّ مَصَائِبٌ لَوْ أَنَّهَا، صُبَّتْ عَلَى الْأَيَّامِ صِرْنَ لَيَالِيَا",
 tr:"Mādzā ‘alā man syamma turbata Ahmadin, an lā yasyamma madaz-zamāni ghawāliyā / Shubbat ‘alayya mashā’ibun lau annahā, shubbat ‘alal-ayyāmi shirna layāliyā",
 m:"Apa ruginya orang yang telah mencium tanah makam Ahmad bila sepanjang masa tak lagi mencium wewangian? Telah tercurah atasku musibah-musibah; andai tercurah pada siang hari, niscaya siang berubah menjadi malam.",
 s:"Dinisbatkan kepada Sayyidah Fatimah; dinukil dalam banyak kitab sejarah dan adab"},
{id:"fat2", f:"fatimah", t:"Imam Ali di sisi kubur Fatimah",
 ar:"السَّلَامُ عَلَيْكَ يَا رَسُولَ اللَّهِ عَنِّي وَعَنِ ابْنَتِكَ النَّازِلَةِ فِي جِوَارِكَ، وَالسَّرِيعَةِ اللَّحَاقِ بِكَ. قَلَّ يَا رَسُولَ اللَّهِ عَنْ صَفِيَّتِكَ صَبْرِي",
 tr:"As-salāmu ‘alaika yā Rasūlallāh ‘annī wa ‘anibnatikan-nāzilati fī jiwārik, was-sarī‘atil-lahāqi bik. Qalla yā Rasūlallāh ‘an shafiyyatika shabrī",
 m:"Salam atasmu, wahai Rasulullah, dariku dan dari putrimu yang kini singgah di sisimu dan begitu cepat menyusulmu. Wahai Rasulullah, telah berkurang kesabaranku atas kepergian putri pilihanmu.",
 s:"Nahjul Balaghah — ucapan Imam Ali saat memakamkan Fatimah"},
{id:"nabi1", f:"nabi", t:"Jawaban Nabi kepada Fatimah",
 ar:"لَيْسَ عَلَى أَبِيكِ كَرْبٌ بَعْدَ الْيَوْمِ",
 tr:"Laisa ‘alā abīki karbun ba‘dal-yaum",
 m:"Tidak ada lagi derita atas ayahmu setelah hari ini.",
 s:"Shahih Bukhari, Kitab al-Maghazi"},
{id:"nabi2", f:"nabi", t:"Husain dariku",
 ar:"حُسَيْنٌ مِنِّي وَأَنَا مِنْ حُسَيْنٍ، أَحَبَّ اللَّهُ مَنْ أَحَبَّ حُسَيْنًا",
 tr:"Husainun minnī wa ana min Husain, ahabballāhu man ahabba Husainā",
 m:"Husain dariku dan aku dari Husain. Allah mencintai siapa yang mencintai Husain.",
 s:"Sunan at-Tirmidzi; Sunan Ibnu Majah"},
{id:"ali1", f:"ali", t:"Ucapan Imam Ali saat ditebas",
 ar:"فُزْتُ وَرَبِّ الْكَعْبَةِ",
 tr:"Fuztu wa rabbil-Ka‘bah",
 m:"Demi Tuhan Ka’bah, aku telah menang.",
 s:"Dinukil luas dalam sumber Sunni dan Syiah"},
{id:"hasan1", f:"hasan", t:"Imam Hasan kepada Husain",
 ar:"لَا يَوْمَ كَيَوْمِكَ يَا أَبَا عَبْدِ اللَّهِ",
 tr:"Lā yauma kayaumika yā Abā ‘Abdillāh",
 m:"Tiada hari seperti harimu, wahai Aba Abdillah.",
 s:"Al-Amali — Syekh Shaduq"},
{id:"sajjad1", f:"sajjad", t:"Khutbah Imam Sajjad di Damaskus",
 ar:"أَنَا ابْنُ مَكَّةَ وَمِنَى، أَنَا ابْنُ زَمْزَمَ وَالصَّفَا",
 tr:"Anabnu Makkata wa Minā, anabnu Zamzama wash-Shafā",
 m:"Akulah putra Makkah dan Mina. Akulah putra Zamzam dan Shafa.",
 s:"Bihar al-Anwar"},
{id:"shadiq1", f:"shadiq", t:"Wasiat terakhir Imam Shadiq",
 ar:"إِنَّ شَفَاعَتَنَا لَا تَنَالُ مُسْتَخِفًّا بِالصَّلَاةِ",
 tr:"Inna syafā‘atanā lā tanālu mustakhiffan bish-shalāh",
 m:"Sungguh, syafaat kami tidak akan sampai kepada orang yang meremehkan shalat.",
 s:"Al-Kafi; Al-Amali (Syekh Shaduq), diriwayatkan oleh Ummu Hamidah"},
{id:"kazhim1", f:"kazhim", t:"Dari shalawat untuk Imam Kazhim",
 ar:"الْمُعَذَّبِ فِي قَعْرِ السُّجُونِ، وَظُلَمِ الْمَطَامِيرِ، ذِي السَّاقِ الْمَرْضُوضِ بِحَلَقِ الْقُيُودِ، وَالْجِنَازَةِ الْمُنَادَى عَلَيْهَا بِذُلِّ الِاسْتِخْفَافِ",
 tr:"Al-mu‘adzdzabi fī qa‘ris-sujūn, wa zhulamil-mathāmīr, dzis-sāqil-mardhūdhi bihalaqil-quyūd, wal-janāzatil-munādā ‘alaihā bidzullil-istikhfāf",
 m:"…yang disiksa di dasar penjara dan gelapnya ruang bawah tanah, yang betisnya remuk oleh lingkaran belenggu, dan yang jenazahnya diumumkan dengan hinaan.",
 s:"Mafatih al-Jinan — shalawat dan ziarah Imam Kazhim",
 n:"Ini potongan dari tengah kalimat, bukan pembuka."},
{id:"ridha1", f:"ridha", t:"Qasidah Di’bil di hadapan Imam Ridha",
 ar:"مَدَارِسُ آيَاتٍ خَلَتْ مِنْ تِلَاوَةٍ، وَمَنْزِلُ وَحْيٍ مُقْفِرُ الْعَرَصَاتِ",
 tr:"Madārisu āyātin khalat min tilāwatin, wa manzilu wahyin muqfirul-‘arashāt",
 m:"Madrasah-madrasah ayat kini sepi dari tilawah, dan rumah turunnya wahyu kini halamannya lengang.",
 s:"Qasidah Ta’iyyah Di’bil al-Khuza’i — ‘Uyun Akhbar ar-Ridha"},
{id:"hadi1", f:"hadi", t:"Pembuka Ziarah Jami’ah Kabirah",
 ar:"السَّلَامُ عَلَيْكُمْ يَا أَهْلَ بَيْتِ النُّبُوَّةِ، وَمَوْضِعَ الرِّسَالَةِ، وَمُخْتَلَفَ الْمَلَائِكَةِ، وَمَهْبِطَ الْوَحْيِ",
 tr:"As-salāmu ‘alaikum yā ahla baitin-nubuwwah, wa maudhi‘ar-risālah, wa mukhtalafal-malā’ikah, wa mahbithal-wahy",
 m:"Salam atas kalian, wahai Ahlul Bait kenabian, tempat risalah, tempat lalu-lalang malaikat, dan tempat turunnya wahyu.",
 s:"Ziarah Jami’ah Kabirah dari Imam Hadi — Man La Yahdhuruhu al-Faqih; Tahdzib al-Ahkam"},
{id:"askari1", f:"askari", t:"Tanda mukmin ada lima",
 ar:"عَلَامَاتُ الْمُؤْمِنِ خَمْسٌ: صَلَاةُ الْإِحْدَى وَالْخَمْسِينَ، وَزِيَارَةُ الْأَرْبَعِينَ، وَالتَّخَتُّمُ فِي الْيَمِينِ، وَتَعْفِيرُ الْجَبِينِ، وَالْجَهْرُ بِبِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ",
 tr:"‘Alāmātul-mu’mini khams: shalātul-ihdā wal-khamsīn, wa ziyāratul-arba‘īn, wat-takhattumu fil-yamīn, wa ta‘fīrul-jabīn, wal-jahru bi bismillāhir-rahmānir-rahīm",
 m:"Tanda mukmin ada lima: shalat lima puluh satu rakaat, ziarah Arbain, cincin di tangan kanan, menempelkan dahi di tanah, dan mengeraskan bismillah.",
 s:"Imam Hasan al-Askari — Tahdzib al-Ahkam; Mishbah al-Mutahajjid"},
{id:"mahdi1", f:"mahdi", t:"Doa Nudbah: di mana?",
 ar:"أَيْنَ الْحَسَنُ؟ أَيْنَ الْحُسَيْنُ؟ أَيْنَ أَبْنَاءُ الْحُسَيْنِ؟ صَالِحٌ بَعْدَ صَالِحٍ، وَصَادِقٌ بَعْدَ صَادِقٍ",
 tr:"Ainal-Hasan? Ainal-Husain? Aina abnā’ul-Husain? Shālihun ba‘da shālih, wa shādiqun ba‘da shādiq",
 m:"Di mana Hasan? Di mana Husain? Di mana putra-putra Husain? Orang saleh demi orang saleh, orang jujur demi orang jujur.",
 s:"Doa Nudbah — Mishbah az-Za’ir; Mafatih al-Jinan"},
{id:"mahdi2", f:"mahdi", t:"Doa Nudbah: berat bagiku",
 ar:"عَزِيزٌ عَلَيَّ أَنْ أَرَى الْخَلْقَ وَلَا تُرَى، وَلَا أَسْمَعُ لَكَ حَسِيسًا وَلَا نَجْوَى",
 tr:"‘Azīzun ‘alayya an aral-khalqa wa lā turā, wa lā asma‘u laka hasīsan wa lā najwā",
 m:"Berat bagiku melihat semua makhluk sementara engkau tak terlihat, dan tak kudengar darimu sedikit pun suara atau bisikan.",
 s:"Doa Nudbah — Mishbah az-Za’ir; Mafatih al-Jinan"},
{id:"arbain1", f:"arbain", t:"Ziarah Arbain",
 ar:"وَبَذَلَ مُهْجَتَهُ فِيكَ لِيَسْتَنْقِذَ عِبَادَكَ مِنَ الْجَهَالَةِ وَحَيْرَةِ الضَّلَالَةِ",
 tr:"Wa badzala muhjatahū fīka liyastanqidza ‘ibādaka minal-jahālati wa hairatidh-dhalālah",
 m:"Ia mempersembahkan darah hatinya di jalan-Mu untuk menyelamatkan hamba-hamba-Mu dari kebodohan dan kebingungan kesesatan.",
 s:"Ziarah Arbain dari Imam Shadiq — Tahdzib al-Ahkam; Mishbah al-Mutahajjid"},
{id:"arbain2", f:"arbain", t:"Jabir di sisi kubur",
 ar:"حَبِيبٌ لَا يُجِيبُ حَبِيبَهُ",
 tr:"Habībun lā yujību habībah",
 m:"Kekasih tak menjawab kekasihnya?",
 s:"Bisyarah al-Mushthafa — Imaduddin ath-Thabari"},
{id:"hamzah1", f:"hamzah", t:"Nabi atas Hamzah",
 ar:"لَكِنَّ حَمْزَةَ لَا بَوَاكِيَ لَهُ",
 tr:"Lākinna Hamzata lā bawākiya lah",
 m:"Tetapi Hamzah, tak ada yang menangisinya.",
 s:"Musnad Ahmad; Sirah Ibnu Hisyam"},
{id:"muslim1", f:"muslim", t:"Tangis Muslim bin Aqil",
 ar:"إِنِّي وَاللَّهِ مَا لِنَفْسِي أَبْكِي… وَلَكِنْ أَبْكِي لِأَهْلِي الْمُقْبِلِينَ إِلَيَّ، أَبْكِي لِلْحُسَيْنِ وَآلِ الْحُسَيْنِ",
 tr:"Innī wallāhi mā linafsī abkī… wa lākin abkī li-ahliyal-muqbilīna ilayy, abkī lil-Husaini wa ālil-Husain",
 m:"Demi Allah, aku tidak menangis untuk diriku… tetapi aku menangisi keluargaku yang sedang menuju kepadaku. Aku menangisi Husain dan keluarga Husain.",
 s:"Tarikh ath-Thabari; Al-Irsyad",
 n:"Bagian tengah kalimat dipotong (…)."}
];

const LS = "menuju-khadim-v1";
const DEFAULT = {v:1, updatedAt:0, xp:0, days:{}, practiceDays:0, cards:{}, studied:{}, spontan:0, spontanFb:0, breathBest:0, journal:[], baits:[], hijriOffset:0, chat:[], lastNew:{d:"",n:0}, firstDay:"", studiedOn:{}};
const clone = o => JSON.parse(JSON.stringify(o));
function load(){ try{ const r = localStorage.getItem(LS); if(r) return Object.assign(clone(DEFAULT), JSON.parse(r)); }catch(e){} return clone(DEFAULT); }
let S = load();
let REF = null, SYNC = "local", writing = false, pendingWrite = false, saveTimer = null;
let SAMPLE = null, SAMPLE_OFF = false, DICT = null;

function prune(){
  const keys = Object.keys(S.days).sort();
  const cut = dk(-120);
  keys.forEach(k=>{ if(k < cut) delete S.days[k]; });
  if(S.chat.length > 24) S.chat = S.chat.slice(-24);
  S.chat = S.chat.map(m => m.content.length > 5000 ? {role:m.role, content:m.content.slice(0, 5000)} : m);
  if(S.journal.length > 60) S.journal = S.journal.slice(-60);
  if(S.baits.length > 120) S.baits = S.baits.slice(-120);
}
function save(){
  S.updatedAt = Date.now(); prune();
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if(!REF) return;
  if(writing){ pendingWrite = true; return; }
  writing = true;
  try{ await REF.set(clone(S)); SYNC = "ok"; }catch(e){ SYNC = "err"; }
  writing = false;
  if(pendingWrite){ pendingWrite = false; flush(); }
}
const timeout = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}), ms))]);

async function initCaps(){
  const C = window.claude;
  if(!C || typeof C.use !== "function"){ SAMPLE_OFF = true; rerender(); return; }
  C.use("sample").then(s=>{ SAMPLE = s; if(!s) SAMPLE_OFF = true; rerender(); }).catch(()=>{ SAMPLE_OFF = true; rerender(); });
  C.use("dictation").then(d=>{ if(d) setupDict(d); rerender(); }).catch(()=>{});
  try{
    const [u, db] = await Promise.all([C.use("user"), C.use("db")]);
    if(!u || !db) return;
    const id = await u.id(); if(!id) return;
    REF = db.doc("data/users/" + id + "/progress");
    const snap = await timeout(REF.get(), 10000);
    if(snap.exists){
      const r = snap.data();
      if((r.updatedAt||0) > (S.updatedAt||0)){
        S = Object.assign(clone(DEFAULT), clone(r));
        try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
        rerender();
      } else if((S.updatedAt||0) > (r.updatedAt||0)) flush();
    } else if(S.updatedAt) flush();
    SYNC = "ok"; rerender();
  }catch(e){ SYNC = "local"; }
}

function dk(off){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+(off||0)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateOf(off){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+(off||0)); return d; }
const dayNum = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5); };

let INTL = null;
try{
  const f = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn", {day:"numeric", month:"numeric", year:"numeric", timeZone:"UTC"});
  if(/islamic/.test(f.resolvedOptions().calendar)) INTL = f;
}catch(e){}
function tabular(y, m, d){
  const jd = Math.floor(Date.UTC(y, m-1, d)/864e5) + 2440588;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l-1)/10631); l = l - 10631*n + 354;
  const j = Math.floor((10985-l)/5316)*Math.floor((50*l)/17719) + Math.floor(l/5670)*Math.floor((43*l)/15238);
  l = l - Math.floor((30-j)/15)*Math.floor((17719*j)/50) - Math.floor(j/16)*Math.floor((15238*j)/43) + 29;
  const hm = Math.floor((24*l)/709), hd = l - Math.floor((709*hm)/24), hy = 30*n + j - 30;
  return {y:hy, m:hm, d:hd};
}
function hijriYMD(y, m, d){
  if(INTL){
    try{
      const o = {};
      INTL.formatToParts(new Date(Date.UTC(y, m-1, d, 12))).forEach(p=>{
        if(p.type==="day") o.d = parseInt(p.value,10);
        else if(p.type==="month") o.m = parseInt(p.value,10);
        else if(p.type==="year" || p.type==="relatedYear") o.y = parseInt(p.value,10);
      });
      if(o.d && o.m && o.y) return o;
    }catch(e){}
  }
  return tabular(y, m, d);
}
const HCACHE = {};
function H(off){
  const key = dk(0) + "|" + S.hijriOffset + "|" + off;
  if(HCACHE[key]) return HCACHE[key];
  const d = dateOf(off + S.hijriOffset);
  return (HCACHE[key] = hijriYMD(d.getFullYear(), d.getMonth()+1, d.getDate()));
}
function nextOcc(ev){
  if(!ev.d && !ev.last) return null;
  for(let i=0; i<=400; i++){
    const h = H(i); if(h.m !== ev.m) continue;
    if(ev.last){ if(H(i+1).m !== ev.m) return i; }
    else if(h.d === ev.d) return i;
  }
  return null;
}
let UPC = null, UPC_KEY = "";
function upcoming(){
  const key = dk(0) + "|" + S.hijriOffset;
  if(UPC && UPC_KEY === key) return UPC;
  const list = [];
  FIG.forEach(f => (f.ev||[]).forEach(ev => { const days = nextOcc(ev); if(days !== null) list.push({fid:f.id, l:ev.l, days, m:ev.m, d:ev.d, last:ev.last}); }));
  list.sort((a,b)=>a.days-b.days);
  UPC = list; UPC_KEY = key; return list;
}
const dayWord = n => n===0 ? "hari ini" : n===1 ? "besok" : n + " hari lagi";
const gShort = off => dateOf(off).toLocaleDateString("id-ID", {weekday:"short", day:"numeric", month:"short"});

/* ============================================================

   ============================================================ */
const esc = s => String(s==null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function seeded(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (arr, r) => arr[Math.floor(r()*arr.length)];
function day(){ const k = dk(0); if(!S.days[k]) S.days[k] = {steps:{}, pre:{}}; return S.days[k]; }
function stepsDone(d){ return STEPS.filter(s => d && d.steps && d.steps[s.id]).length; }
function streak(){
  let n = 0;
  const today = S.days[dk(0)];
  let start = (today && stepsDone(today) >= 4) ? 0 : -1;
  for(let i=start; i>=-120; i--){ const d = S.days[dk(i)]; if(d && stepsDone(d) >= 4) n++; else break; }
  return n;
}
function mastered(){ return Object.values(S.cards).filter(c => c.box >= 5).length; }
function studiedCount(){ return Object.keys(S.studied).filter(k => S.studied[k] > 0).length; }
function khadimReq(){
  return [
    ["40 hari latihan", S.practiceDays >= 40, S.practiceDays + "/40"],
    ["15 hafalan lancar", mastered() >= 15, mastered() + "/15"],
    ["Semua tokoh dipelajari", studiedCount() >= FIG.length, studiedCount() + "/" + FIG.length],
    ["30 latihan spontan", S.spontan >= 30, S.spontan + "/30"],
    ["5 catatan majlis", S.journal.length >= 5, S.journal.length + "/5"]
  ];
}
function levelIdx(){
  let i = 0; LEVELS.forEach((L, k) => { if(S.xp >= L.xp) i = k; });
  if(i === 5 && !khadimReq().every(r => r[1])) i = 4;
  return i;
}
function addXP(n, msg){
  const before = levelIdx();
  S.xp += n; save();
  const after = levelIdx();
  if(after > before) toast("Naik tingkat: " + LEVELS[after].n);
  else toast("+" + n + " XP" + (msg ? " · " + msg : ""));
}
function completeStep(id){
  const d = day();
  if(d.steps[id]) return;
  d.steps[id] = 1;
  let gain = 10;
  const done = stepsDone(d);
  if(done >= 4 && !d.counted){ d.counted = 1; S.practiceDays++; if(!S.firstDay) S.firstDay = dk(0); }
  if(done === STEPS.length){ gain += 30; }
  addXP(gain, done === STEPS.length ? "Sesi lengkap" : STEPS.find(s=>s.id===id).t);
}
let toastT = null;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 2400); }

function focusFig(){
  const up = upcoming().find(e => e.days <= 10);
  if(up) return {f:FIG_BY[up.fid], why:"Persiapan " + up.l + " (" + dayWord(up.days) + ")"};
  return {f:FIG[dayNum() % FIG.length], why:"Giliran harian"};
}
function daily(){
  const r = seeded(dayNum() * 7919);
  const n = dayNum();
  const ff = focusFig().f;
  const cats = DIKSI.slice(0, 8);
  const c1 = pick(cats, r), c2 = pick(cats.filter(c=>c!==c1), r), c3 = pick(cats.filter(c=>c!==c1 && c!==c2), r);
  return {
    niat: NIAT[n % NIAT.length], napas: NAPAS[n % NAPAS.length], suara: SUARA[(n+2) % SUARA.length],
    maqam: MAQAM[n % MAQAM.length], sehat: SEHAT[n % SEHAT.length], fig: ff,
    words: [pick(c1.w, r), pick(c2.w, r), pick(c3.w, r)]
  };
}

/* simple markdown for AI replies */
function md(text){
  const lines = esc(text).split(/\n/);
  let html = "", inList = false, para = [];
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/_\((.+?)\)_/g, "<em>($1)</em>");
  const flushP = () => { if(para.length){ html += '<p dir="auto">' + inline(para.join("<br>")) + "</p>"; para = []; } };
  lines.forEach(l => {
    const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    const h = l.match(/^\s*#{1,4}\s+(.*)$/);
    if(m){ flushP(); if(!inList){ html += "<ul>"; inList = true; } html += '<li dir="auto">' + inline(m[1]) + "</li>"; }
    else { if(inList){ html += "</ul>"; inList = false; }
      if(!l.trim()) flushP();
      else if(h){ flushP(); html += '<p dir="auto"><strong>' + inline(h[1]) + "</strong></p>"; }
      else para.push(l); }
  });
  if(inList) html += "</ul>"; flushP();
  return html;
}

let TIMER = null, wakeLock = null;
function fmt(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
function timerHTML(id, sec){
  const on = TIMER && TIMER.id === id;
  const left = on ? (TIMER.end - Date.now())/1000 : sec;
  return '<div class="timer"><span class="clock" id="clk-' + id + '">' + fmt(left) + '</span><button class="btn ghost" data-act="timer" data-id="' + id + '" data-sec="' + sec + '">' + (on ? "Hentikan" : "Mulai") + "</button></div>";
}
function startTimer(id, sec){
  if(TIMER && TIMER.id === id){ stopTimer(); rerender(); return; }
  stopTimer();
  TIMER = {id, end: Date.now() + sec*1000};
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wakeLock = w; }).catch(()=>{}); }catch(e){}
  TIMER.iv = setInterval(() => {
    const left = (TIMER.end - Date.now())/1000;
    const el = document.getElementById("clk-" + id);
    if(el) el.textContent = fmt(left);
    if(left <= 0){ stopTimer(); toast("Waktu habis"); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} rerender(); }
  }, 250);
  rerender();
}
function stopTimer(){ if(TIMER){ clearInterval(TIMER.iv); TIMER = null; } try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }

let DICT_T = null, DICT_ON = false;
function setupDict(d){
  DICT = d;
  d.onFinal(({text}) => {
    const t = document.getElementById(DICT_T); if(!t) return;
    t.value = t.value ? t.value + text : text.replace(/^\s+/, "");
    t.dispatchEvent(new Event("input", {bubbles:true}));
  });
  d.onPartial(({text}) => { const h = document.getElementById((DICT_T||"") + "-hint"); if(h) h.textContent = text; });
  d.onState(({state, reason}) => {
    DICT_ON = state !== "idle";
    document.querySelectorAll('[data-act="dict"]').forEach(b => b.classList.toggle("on", DICT_ON && b.dataset.t === DICT_T));
    if(state === "idle"){ const h = document.getElementById((DICT_T||"") + "-hint"); if(h) h.textContent = ""; if(reason === "unavailable" || reason === "not_granted"){ DICT = null; rerender(); } }
  });
}

function firstLetter(w){
  const marks = /[ً-ٰٟۖ-ۭ]/;
  const chars = Array.from(w); let out = "", base = 0;
  const startsAl = chars.filter(c => !marks.test(c)).slice(0,2).join("") === "ال";
  const need = startsAl ? 3 : 1;
  for(const c of chars){ if(!marks.test(c)){ if(base >= need) break; base++; } out += c; }
  return out;
}
function arBlock(text, level, rev){
  return text.split("\n").map((line, li) => '<span class="arl">' + line.split(" ").filter(Boolean).map((w, wi) => {
    const key = li + "-" + wi;
    const hide = level === 1 ? (wi % 3 === 1) : level >= 2;
    if(!hide || rev[key]) return '<span class="w">' + esc(w) + "</span>";
    if(level === 2) return '<button class="w" data-act="rev" data-k="' + key + '">' + esc(firstLetter(w)) + "ـ…</button>";
    return '<button class="w" data-act="rev" data-k="' + key + '">' + "ـ".repeat(Math.min(7, Math.max(3, Math.round(w.length/2)))) + "</button>";
  }).join(" ") + "</span>").join("");
}
